# USDMXN tipos de cambio históricos
# Fuente: Banxico SIE (Sistema de Información Económica)
#         https://www.banxico.org.mx/SieInternet/consultarDirectorioInternetAction.do?accion=consultarCuadro&idCuadro=CF102
#
# eop = end of period (cierre del trimestre)  → para BALANCE SHEET / stocks
# avg = promedio del periodo (TC promedio)     → para INCOME STATEMENT / flujos
#                                                (Damodaran convention)
#
# CONVENCIÓN: USDMXN = pesos por dólar (e.g., 20.50 = $20.50 MXN por $1 USD)
#
# Datos validados contra Banxico DOF (Diario Oficial Federación) al cierre de cada trimestre.
# Para periodos futuros (>= fecha actual), usar el último cierre disponible.


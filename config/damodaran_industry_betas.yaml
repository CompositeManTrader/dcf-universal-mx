# Industry Average Beta — Damodaran Global (Jan-2026)
# https://pages.stern.nyu.edu/~adamodar/New_Home_Page/datafile/Betas.html
#
# Para cada industria:
#   beta_unlevered:  bottom-up beta promedio (sin apalancar)
#   d_e_ratio:       average D/E ratio del industry (para info)
#   tax_rate:        avg corporate tax rate (Damodaran assumption)
#   sales_to_capital: median industry sales to invested capital ratio
#   target_op_margin: median industry pre-tax operating margin
#   roic:            median industry ROIC
#   notes:           contexto opcional

